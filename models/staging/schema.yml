version: 2

sources:
  - name: raw
    description: "Raw gaming data landed by AWS Glue from S3"
    schema: raw
    tables:
      - name: game_performance_audit
        description: "Daily EGM performance data ingested from CSV files"
        
models:
  - name: stg_game_performance
    description: Staging model for gaming performance data
    columns:
      - name: bus_date
        tests:
          - not_null
      - name: venue_code
        tests:
          - not_null
      - name: egm_description
        tests:
          - not_null
      - name: manufacturer
        tests:
          - not_null
      - name: fp
        tests:
          - not_null